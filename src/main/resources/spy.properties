# The real JDBC driver that P6Spy wraps to intercept SQL calls
driverlist=org.postgresql.Driver

# Timestamp format used in log output
dateformat=yyyy-MM-dd HH:mm:ss

# Where to print logs - StdoutLogger prints to console (process.stdout in Node.js)
appender=com.p6spy.engine.spy.appender.StdoutLogger

# Use a custom format string instead of the default log format
logMessageFormat=com.p6spy.engine.spy.appender.CustomLineFormat

# Custom log format: shows execution time in ms and the SQL query on one line
# Example output: [SQL] 5ms | SELECT * FROM users WHERE id = 1
customLogMessageFormat=[SQL] %(executionTime)ms | %(sqlSingleLine)

# Suppress noisy internal P6Spy log categories - only actual SQL queries are logged
excludecategories=info,debug,result,resultset