# Base URL of this server and the path used to build QR code item links
# Example full URL: http://localhost:8081/item?itemId=1
mystuff.server.address=http://localhost:8081
mystuff.item.path=/item?itemId=

# Google OAuth2 credentials - obtain from Google Cloud Console
spring.config.import=optional:file:.env[.properties]

google.client-id=${GOOGLE_CLIENT_ID:test-client-id}
google.client-secret=${GOOGLE_CLIENT_SECRET:test-client-secret}

# PostgreSQL datasource
# P6Spy wraps the real driver to log all SQL queries - useful for debugging
spring.datasource.url=jdbc:p6spy:postgresql://localhost/postgres
spring.datasource.driverClassName=com.p6spy.engine.spy.P6SpyDriver
# Use these instead to connect without SQL logging
#spring.datasource.driverClassName=org.postgresql.Driver
#spring.datasource.url=jdbc:postgresql://localhost/postgres
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# Hibernate / JPA
# Uncomment to log all SQL statements to console (alternative to P6Spy)
#spring.jpa.show-sql=true
# Uncomment if Hibernate dialect needs to be set explicitly
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Do not run schema/data SQL scripts on startup - schema is managed manually
spring.sql.init.mode=never
# Do not let Hibernate auto-create or modify tables - schema is managed manually
spring.jpa.hibernate.ddl-auto=none
