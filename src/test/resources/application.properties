# Use plain PostgreSQL driver — no P6Spy SQL logging needed in tests.
# The datasource URL/username/password are overridden by @DynamicPropertySource.
spring.datasource.driverClassName=org.postgresql.Driver

# Stub out Google OAuth — not needed in integration tests.
google.client-id=test-client-id

# Stub out app-specific properties — not exercised in integration tests.
mystuff.server.address=http://localhost:8080
mystuff.item.path=/item?itemId=

# Provide placeholder values so Spring doesn't fail on the ${DB_USERNAME} / ${DB_PASSWORD}
# references in the main application.properties before @ServiceConnection kicks in.
spring.datasource.username=test
spring.datasource.password=test

# Initialize the schema and seed roles on every test run against the fresh Testcontainers DB.
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:db/schema.sql
spring.sql.init.data-locations=classpath:db/roles.sql
spring.jpa.hibernate.ddl-auto=none
