name: Deploy Backend

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create Dockerfile
        run: |
          cat > Dockerfile << 'EOF'
          FROM eclipse-temurin:25-jdk AS builder
          WORKDIR /app
          COPY . .
          RUN chmod +x ./gradlew && ./gradlew bootJar --no-daemon
          FROM eclipse-temurin:25-jre
          WORKDIR /app
          COPY --from=builder /app/build/libs/*.jar app.jar
          ENTRYPOINT ["java", "-jar", "app.jar"]
          EOF

      - name: Create nginx config
        run: |
          mkdir -p nginx
          cat > nginx/nginx.conf << 'EOF'
          events {
              worker_connections 1024;
          }
          http {
              server {
                  listen 80;
                  server_name tag-ly.eu www.tag-ly.eu;
                  client_max_body_size 13m;
                  location /api/ {
                      proxy_pass http://team2-backend:8080;
                      proxy_set_header Host $host;
                      proxy_set_header X-Real-IP $remote_addr;
                  }
                  location /item {
                      proxy_pass http://team2-backend:8080;
                      proxy_set_header Host $host;
                      proxy_set_header X-Real-IP $remote_addr;
                  }
                  location /items {
                      proxy_pass http://team2-backend:8080;
                      proxy_set_header Host $host;
                      proxy_set_header X-Real-IP $remote_addr;
                  }
                  location /qr-code {
                      proxy_pass http://team2-backend:8080;
                      proxy_set_header Host $host;
                      proxy_set_header X-Real-IP $remote_addr;
                  }
                  location ~ ^/[0-9]+/images/ {
                      proxy_pass http://team2-backend:8080;
                      proxy_set_header Host $host;
                      proxy_set_header X-Real-IP $remote_addr;
                  }
                  location / {
                      proxy_pass http://192.168.42.25:8081;
                      proxy_set_header Host $host;
                      proxy_set_header X-Real-IP $remote_addr;
                  }
              }
          }
          EOF

      - name: Create docker-compose
        run: |
          cat > docker-compose.prod.yml << 'EOF'
          services:
            postgres:
              image: postgres:16
              container_name: team2-postgres
              env_file:
                - /home/ubuntu/team-2-qr-backend/.env
              environment:
                POSTGRES_USER: ${DB_USERNAME}
                POSTGRES_PASSWORD: ${DB_PASSWORD}
                POSTGRES_DB: postgres
              ports:
                - "5432:5432"
              volumes:
                - pgdata:/var/lib/postgresql/data
                - /home/ubuntu/team-2-qr-backend/database:/docker-entrypoint-initdb.d:ro
              healthcheck:
                test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
                interval: 5s
                timeout: 3s
                retries: 20
            backend:
              image: ghcr.io/taltech-vanemarendajaks/team-2-qr-backend:latest
              container_name: team2-backend
              env_file:
                - /home/ubuntu/team-2-qr-backend/.env
              depends_on:
                postgres:
                  condition: service_healthy
              environment:
                SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/postgres
                SPRING_DATASOURCE_DRIVERCLASSNAME: org.postgresql.Driver
                SPRING_DATASOURCE_USERNAME: ${DB_USERNAME}
                SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
                SPRING_SQL_INIT_MODE: always
                SPRING_JPA_HIBERNATE_DDL_AUTO: none
            nginx:
              image: nginx:alpine
              container_name: team2-nginx
              ports:
                - "80:80"
              volumes:
                - /home/ubuntu/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
              depends_on:
                - backend
              restart: unless-stopped
          volumes:
            pgdata:
          EOF

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/team-2-qr-backend:latest

      - name: Copy nginx config to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          source: "nginx/nginx.conf"
          target: "/home/ubuntu/"

      - name: Copy docker-compose to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          source: "docker-compose.prod.yml"
          target: "/home/ubuntu/"

      - name: Write .env file
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          DB_USERNAME: ${{ secrets.DB_USERNAME }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          MAILTRAP_API_TOKEN: ${{ secrets.MAILTRAP_API_TOKEN }}
          MAILTRAP_FROM_EMAIL: ${{ secrets.MAILTRAP_FROM_EMAIL }}
          MAILTRAP_FROM_NAME: ${{ secrets.MAILTRAP_FROM_NAME }}
          RESET_LINK_BASE: ${{ secrets.RESET_LINK_BASE }}
          SESSION_COOKIE_SECURE: ${{ secrets.SESSION_COOKIE_SECURE }}
          MYSTUFF_SERVER_ADDRESS: ${{ secrets.MYSTUFF_SERVER_ADDRESS }}
        run: |
          printf 'GOOGLE_CLIENT_ID=%s\n' "$GOOGLE_CLIENT_ID" > .env
          printf 'GOOGLE_CLIENT_SECRET=%s\n' "$GOOGLE_CLIENT_SECRET" >> .env
          printf 'DB_USERNAME=%s\n' "$DB_USERNAME" >> .env
          printf 'DB_PASSWORD=%s\n' "$DB_PASSWORD" >> .env
          printf 'MAILTRAP_API_TOKEN=%s\n' "$MAILTRAP_API_TOKEN" >> .env
          printf 'MAILTRAP_FROM_EMAIL=%s\n' "$MAILTRAP_FROM_EMAIL" >> .env
          printf 'MAILTRAP_FROM_NAME=%s\n' "$MAILTRAP_FROM_NAME" >> .env
          printf 'RESET_LINK_BASE=%s\n' "$RESET_LINK_BASE" >> .env
          printf 'SESSION_COOKIE_SECURE=%s\n' "$SESSION_COOKIE_SECURE" >> .env
          printf 'MYSTUFF_SERVER_ADDRESS=%s\n' "$MYSTUFF_SERVER_ADDRESS" >> .env

      - name: Copy .env to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          source: ".env"
          target: "/home/ubuntu/team-2-qr-backend/"

      - name: Deploy on server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            cd /home/ubuntu/team-2-qr-backend
            git pull origin master
            chmod 600 /home/ubuntu/team-2-qr-backend/.env
            docker stop team2-nginx team2-backend team2-postgres || true
            docker rm team2-nginx team2-backend team2-postgres || true
            docker compose -f /home/ubuntu/docker-compose.prod.yml pull
            docker compose -f /home/ubuntu/docker-compose.prod.yml up -d postgres
            until docker exec team2-postgres pg_isready -U $(grep DB_USERNAME /home/ubuntu/team-2-qr-backend/.env | cut -d= -f2) -d postgres; do sleep 1; done
            source /home/ubuntu/team-2-qr-backend/.env
            docker exec team2-postgres psql -U $DB_USERNAME -d postgres -c "ALTER TABLE mystuff.item ADD COLUMN IF NOT EXISTS warranty_end_date date NULL;"
            docker exec team2-postgres psql -U $DB_USERNAME -d postgres -c "ALTER TABLE mystuff.item ADD COLUMN IF NOT EXISTS warranty_notify_at timestamptz NULL;"
            docker compose -f /home/ubuntu/docker-compose.prod.yml up -d
